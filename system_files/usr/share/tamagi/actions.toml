[[action]]
id = "install.flatpak"
category = "install"
icon = "system-software-install-symbolic"
risk = "user"
terminal = true
confirm = false
agent = false
command = "bash -c '. /usr/libexec/tamagi/i18n; term=$(gum input --placeholder \"$(t \"nome do app (ex.: gimp, spotify, vscode)\")\") || exit 0; [[ -n $term ]] || exit 0; app=$(flatpak search --columns=application,name,description \"$term\" 2>/dev/null | gum filter --header \"$(t \"Escolha o app\")\" | awk \"{print \\$1}\") || exit 0; [[ -n $app ]] && flatpak install -y flathub \"$app\"'"
keywords = "flatpak flathub app loja store install instalar"
