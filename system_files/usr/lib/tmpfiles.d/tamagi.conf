# /var/log/tuned não tem entrada de tmpfiles no pacote: sem isto é o próprio
# tuned que cria a pasta, com o rótulo SELinux genérico (var_log_t), e o
# tuned-ppd (perfis de energia do desktop) não consegue gravar o log e falha.
# Criada aqui, a pasta recebe o rótulo certo (tuned_log_t); "z" corrige
# instalações que já tenham a pasta errada.
d /var/log/tuned 0755 root root -
z /var/log/tuned - - - -

# Garante o rótulo SELinux home_root_t no subvolume montado em /var/home (sem recursão).
z /var/home 0755 root root -
