# Tamagi — desempenho de desktop e jogos (mesmas escolhas do Bazzite + ajustes de baixa latência).

# Jogos com muitos mapeamentos de memória (Proton/Wine). O mesmo valor do SteamOS.
vm.max_map_count = 2147483642
# Jogos antigos travam com a mitigação de split lock; desktop não precisa dela.
kernel.split_lock_mitigate = 0
# Desliga o NMI watchdog: libera um contador PMU de hardware por núcleo e reduz jitter.
kernel.nmi_watchdog = 0
# Controle de congestionamento BBR com fila fq + TCP Fast Open e buffers otimizados.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_slow_start_after_idle = 0
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.core.netdev_max_backlog = 16384
# IDEs, sincronizadores e contêineres vigiam muitos arquivos.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 8192
# Writeback em bytes fixos (64 MB / 256 MB): evita travadas de E/S em máquinas com muita RAM.
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456
# Mantém cache de metadados/diretórios por mais tempo em RAM (acelera git, rg, builds).
vm.vfs_cache_pressure = 50
# Swap comprimido em RAM (zram): trocar cedo e página a página.
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
