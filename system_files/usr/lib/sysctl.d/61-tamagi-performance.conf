# Tamagi — desempenho de desktop e jogos (mesmas escolhas do Bazzite).

# Jogos com muitos mapeamentos de memória (Proton/Wine). O mesmo valor do SteamOS.
vm.max_map_count = 2147483642
# Jogos antigos travam com a mitigação de split lock; desktop não precisa dela.
kernel.split_lock_mitigate = 0
# Controle de congestionamento BBR com fila fq.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
# IDEs, sincronizadores e contêineres vigiam muitos arquivos.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 8192
# Swap comprimido em RAM (zram): trocar cedo e página a página.
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
