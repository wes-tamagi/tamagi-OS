# Privacidade de rede, como no GrapheneOS: endereço MAC aleatório ao procurar
# redes Wi-Fi e um MAC diferente (mas fixo) para cada rede salva.
# Modo estrito (MAC novo a cada conexão): tamagi-harden strict.
[device]
wifi.scan-rand-mac-address=yes

[connection]
wifi.cloned-mac-address=stable
ipv6.ip6-privacy=2
