# systemd-boot do Tamagi. O bootc copia este arquivo para a partição EFI só na
# instalação; o tamagi-loader-conf.service garante "editor no" nas instalações
# anteriores. O menu continua aparecendo (segure Espaço no boot) para escolher
# a versão anterior do sistema; só a edição da linha do kernel ("e") fica
# desligada: com ela, quem tem o computador na mão abre um shell de root.
editor no
