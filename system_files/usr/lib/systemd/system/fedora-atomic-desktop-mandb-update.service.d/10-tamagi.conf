# A base roda isto a cada boot; o resultado só muda com uma imagem nova.
# Aqui roda uma vez por imagem, em segundo plano e sem disputar o disco.
[Service]
ExecCondition=/usr/libexec/tamagi/once-per-image check mandb
ExecStartPost=/usr/libexec/tamagi/once-per-image done mandb
IOSchedulingClass=idle
CPUWeight=20
