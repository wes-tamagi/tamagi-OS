# O ConditionNeedsUpdate= compara a data do /usr, que numa imagem é sempre
# 1970: o cache era refeito no primeiro boot e nunca mais, ficando velho depois
# das atualizações. Aqui o cache é refeito uma vez por imagem nova (ou se
# sumir) e nunca atrasa o boot por mais de 30 s.
[Unit]
ConditionNeedsUpdate=

[Service]
ExecCondition=/usr/bin/bash -c '[[ ! -s /etc/ld.so.cache ]] || /usr/libexec/tamagi/once-per-image check ldconfig'
ExecStartPost=/usr/libexec/tamagi/once-per-image done ldconfig
TimeoutStartSec=30
