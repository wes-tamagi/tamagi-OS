# ConditionNeedsUpdate= compares /usr's timestamp (1970 in an OCI image), while
# ConditionFileNotEmpty=|!/etc/ld.so.cache would skip rebuilds after the first
# boot even when the image changes. Clear both [Unit] conditions and run once
# per image (or if /etc/ld.so.cache is missing), never on live media.
[Unit]
ConditionNeedsUpdate=
ConditionFileNotEmpty=
ConditionPathExists=!/run/tamagi-live

[Service]
ExecCondition=/usr/bin/bash -c '[[ ! -s /etc/ld.so.cache ]] || /usr/libexec/tamagi/once-per-image check ldconfig'
ExecStartPost=/usr/libexec/tamagi/once-per-image done ldconfig
TimeoutStartSec=180
