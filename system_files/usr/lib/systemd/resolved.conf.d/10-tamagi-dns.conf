# Tamagi — DNS rápido e resiliente no systemd-resolved.
# DNSSEC=allow-downgrade evita timeouts de 5s em roteadores domésticos antigos;
# FallbackDNS só é usado se o DHCP não responder.
[Resolve]
Cache=yes
DNSSEC=allow-downgrade
DNSOverTLS=opportunistic
FallbackDNS=1.1.1.1#cloudflare-dns.com 9.9.9.9#dns.quad9.net
