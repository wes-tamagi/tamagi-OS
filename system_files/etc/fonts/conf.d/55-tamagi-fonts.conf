<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Tamagi: Roboto Flex / Inter na interface, Noto Serif em documentos e
     JetBrains Mono no terminal, com antialiasing nítido e hintslight. -->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
  <alias><family>sans-serif</family><prefer><family>Roboto Flex</family><family>Inter</family><family>Noto Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Noto Serif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Roboto Flex</family><family>Inter</family><family>Noto Sans</family></prefer></alias>
</fontconfig>
