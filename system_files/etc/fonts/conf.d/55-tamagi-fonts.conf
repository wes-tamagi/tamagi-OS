<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Tamagi: Roboto Flex é a fonte da interface (Material 3), com a Noto Sans
     logo atrás para os alfabetos que ela não cobre; JetBrains Mono fica no
     terminal. Sem binding forte: para japonês, árabe etc. a fonte certa do
     idioma continua vencendo. -->
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>Roboto Flex</family><family>Noto Sans</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Roboto Flex</family><family>Noto Sans</family></prefer></alias>
</fontconfig>
