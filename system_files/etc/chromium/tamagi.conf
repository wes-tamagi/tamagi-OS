# shellcheck shell=bash
# Tamagi OS defaults for native Chromium:
#  - Tamagi-DxAI: Google Account OAuth2 sign-in & sync credentials (toggle via
#    `tamagi install browser google-account off`)
#  - Tamagi-SKL: OAuth2 strictly disabled; Managed Policy enforces no password
#    saving, cookie/session wipe on exit, and 15-day history retention.
#  - Wayland IME, PipeWire WebRTC capture, hardware decode, and touchpad swipe.

_tamagi_conf_dir="${XDG_CONFIG_HOME:-$HOME/.config}/tamagi"
_tamagi_edition=$(cat /usr/share/tamagi/edition 2>/dev/null || echo dxai)

if [[ $_tamagi_edition != skl && ! -e "$_tamagi_conf_dir/no-chromium-google-account" ]]; then
    CHROMIUM_FLAGS+=" --oauth2-client-id=77185425430.apps.googleusercontent.com"
    CHROMIUM_FLAGS+=" --oauth2-client-secret=OTJgUOQcT7lO7GsGZq2G4IlT"
fi

if [[ -n ${WAYLAND_DISPLAY:-} ]]; then
    CHROMIUM_FLAGS+=" --ozone-platform-hint=auto --enable-wayland-ime --wayland-text-input-version=3"
fi

_tamagi_add_features="WebRTCPipeWireCapturer,TouchpadOverscrollHistoryNavigation,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,VaapiIgnoreDriverChecks"
if [[ ${CHROMIUM_FLAGS:-} == *"--enable-features="* ]]; then
    read -r -a _tamagi_toks <<<"$CHROMIUM_FLAGS"
    CHROMIUM_FLAGS=""
    for _tamagi_tok in "${_tamagi_toks[@]}"; do
        if [[ $_tamagi_tok == --enable-features=* ]]; then
            _tamagi_tok+=",${_tamagi_add_features}"
        fi
        CHROMIUM_FLAGS+=" ${_tamagi_tok}"
    done
    unset _tamagi_toks _tamagi_tok
else
    CHROMIUM_FLAGS+=" --enable-features=${_tamagi_add_features}"
fi
unset _tamagi_add_features

if [[ $_tamagi_edition != skl ]]; then
    _tamagi_user_flags="${XDG_CONFIG_HOME:-$HOME/.config}/chromium-flags.conf"
    if [[ -r $_tamagi_user_flags ]]; then
        while IFS= read -r _tamagi_line || [[ -n $_tamagi_line ]]; do
            _tamagi_line="${_tamagi_line%%#*}"
            _tamagi_line="${_tamagi_line#"${_tamagi_line%%[![:space:]]*}"}"
            _tamagi_line="${_tamagi_line%"${_tamagi_line##*[![:space:]]}"}"
            [[ -n $_tamagi_line ]] && CHROMIUM_FLAGS+=" ${_tamagi_line}"
        done < "$_tamagi_user_flags"
        unset _tamagi_line
    fi
    unset _tamagi_user_flags
fi
unset _tamagi_conf_dir _tamagi_edition
