name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    container:
      image: quay.io/fedora/fedora:45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: dnf -y install --setopt=install_weak_deps=False cargo rust gcc glibc-static
      - name: Run unit tests
        run: cargo test --release --locked
      - name: Build static binaries
        run: RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --locked --target x86_64-unknown-linux-gnu
