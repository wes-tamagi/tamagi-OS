---
# Constrói o Tamagi (Tamagi-DxAI e Tamagi-SKL), testa e publica no GHCR.
# É de lá que as máquinas instaladas puxam atualizações:
#   sudo bootc switch ghcr.io/<dono>/tamagi:latest      (Tamagi-DxAI)
#   sudo bootc switch ghcr.io/<dono>/tamagi-skl:latest  (Tamagi-SKL)
#
# Fluxo e ações fixadas por commit seguem o ublue-os/image-template. Diferenças
# do Tamagi: matriz multi-edição (dxai + skl) e a etapa de testes (tests/image.sh),
# que roda antes de qualquer publicação.
#
# As imagens não contêm o Chrome (baixado na máquina do usuário), então podem
# ser públicas.
name: build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  schedule:
    - cron: "17 5 * * *" # todo dia, para pegar atualizações da base (Universal Blue)
  workflow_dispatch:

env:
  FEDORA_VERSION: "45"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Construir, testar e publicar (${{ matrix.edition }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: dxai
            image_name: tamagi
          - edition: skl
            image_name: tamagi-skl
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # Versões fixadas por commit; o dependabot propõe as atualizações.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Liberar espaço em disco
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Preparar ambiente
        run: |
          # O GHCR só aceita o dono em minúsculas.
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${{ matrix.image_name }}" >> "$GITHUB_ENV"
          echo "TAMAGI_EDITION=${{ matrix.edition }}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Construir
        run: |
          sudo podman build \
            --build-arg FEDORA_VERSION=${FEDORA_VERSION} \
            --build-arg TAMAGI_EDITION=${TAMAGI_EDITION} \
            --build-arg IMAGE_NAME=${IMAGE_NAME} \
            --build-arg KERNEL_FLAVOR=ogc \
            --build-arg AKMODS_FLAVOR=ogc \
            --build-arg IMAGE_VENDOR=${GITHUB_REPOSITORY_OWNER,,} \
            --build-arg IMAGE_REF=${IMAGE_REGISTRY}/${IMAGE_NAME} \
            -t ${IMAGE_NAME}:layers \
            .
          # Rechunk: a imagem refeita só com o conteúdo real, em camadas por
          # conteúdo (veja rechunk.sh). É esta que é testada e publicada.
          sudo bash rechunk.sh ${IMAGE_NAME}:layers ${IMAGE_NAME}:build "$PWD/output/rechunk-${TAMAGI_EDITION}"

      - name: Testar
        run: sudo podman run --rm -v ./tests:/tests:ro ${IMAGE_NAME}:build bash /tests/image.sh

      # Daqui para baixo só no branch principal: um pull request constrói e
      # testa, mas nunca publica nada em seu nome.
      - name: Entrar no GHCR
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publicar
        id: push
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        run: |
          set -euo pipefail
          # Uma imagem só, com inglês como idioma padrão: 45, 45.AAAAMMDD e latest.
          # (A variante em português só é construída localmente: TAMAGI_DEFAULT_LANG=pt just build.)
          tags="${FEDORA_VERSION} ${FEDORA_VERSION}.${BUILD_DATE} latest"
          for tag in $tags; do
            sudo podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:build ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done
          echo "digest=$(sudo cat /tmp/digestfile)" >> "$GITHUB_OUTPUT"

      # Assinatura da imagem (cosign), como no image-template. Só roda se o
      # segredo SIGNING_SECRET existir no repositório:
      #   cosign generate-key-pair      (sem senha)
      #   gh secret set SIGNING_SECRET < cosign.key
      #   git add cosign.pub            (a chave pública vai para o repositório)
      - name: Instalar o cosign
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v3.1.4"

      - name: Assinar a imagem
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PRIVATE_KEY_2: ${{ secrets.SIGNING_SECRET_2 }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if [ -z "${COSIGN_PRIVATE_KEY}" ]; then
            # O sistema instalado recusa imagem do Tamagi sem assinatura: publicar
            # sem assinar deixaria todos sem atualização.
            echo "::error::SIGNING_SECRET não configurado: a imagem foi publicada SEM assinatura e será recusada pelos sistemas instalados."
            exit 1
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Formato antigo de bundle, como no image-template (compatível com rpm-ostree).
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}
          # Segunda chave (cosign-2.pub), a que tem cópia de segurança com o
          # mantenedor: os sistemas aceitam qualquer uma das duas. Enquanto o
          # segredo SIGNING_SECRET_2 não existir, a imagem sai só com a primeira.
          if [ -n "${COSIGN_PRIVATE_KEY_2}" ]; then
            cosign sign -y --new-bundle-format=false --use-signing-config=false \
              --key env://COSIGN_PRIVATE_KEY_2 ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}
          else
            echo "::warning::SIGNING_SECRET_2 não configurado: imagem assinada só com a primeira chave."
          fi
