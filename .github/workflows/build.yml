---
# Constrói o Tamagi, testa e publica no GHCR. É de lá que as máquinas
# instaladas puxam atualizações (bootc switch ghcr.io/<dono>/tamagi:latest).
#
# Fluxo e ações fixadas por commit seguem o ublue-os/image-template. Diferenças
# do Tamagi: os argumentos de build do Containerfile e a etapa de testes
# (tests/image.sh), que roda antes de qualquer publicação.
#
# A imagem não contém o Chrome (é baixado na máquina do usuário), então pode
# ser pública.
name: build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  schedule:
    - cron: "17 5 * * *" # todo dia, para pegar atualizações da base (Universal Blue)
  workflow_dispatch:

env:
  IMAGE_NAME: tamagi
  FEDORA_VERSION: "45"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Construir, testar e publicar (${{ matrix.flavor }})
    runs-on: ubuntu-24.04
    # Dois sabores de kernel, em paralelo: main (o da base, tags latest/45) e
    # ark (kernel-ark, o do Rawhide; tags ark/ark-45). Um falhar não derruba o outro.
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: main
            akmods: main
            prefix: ""
          - flavor: ark
            akmods: main
            prefix: "ark-"
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # Versões fixadas por commit; o dependabot propõe as atualizações.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Liberar espaço em disco
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Preparar ambiente
        run: |
          # O GHCR só aceita o dono em minúsculas.
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Construir
        run: |
          sudo podman build \
            --build-arg FEDORA_VERSION=${FEDORA_VERSION} \
            --build-arg KERNEL_FLAVOR=${{ matrix.flavor }} \
            --build-arg AKMODS_FLAVOR=${{ matrix.akmods }} \
            --build-arg IMAGE_VENDOR=${GITHUB_REPOSITORY_OWNER,,} \
            --build-arg IMAGE_REF=${IMAGE_REGISTRY}/${IMAGE_NAME} \
            -t ${IMAGE_NAME}:build \
            .

      - name: Testar
        run: sudo podman run --rm -v ./tests:/tests:ro ${IMAGE_NAME}:build bash /tests/image.sh

      # Daqui para baixo só no branch principal: um pull request constrói e
      # testa, mas nunca publica nada em seu nome.
      - name: Entrar no GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publicar
        id: push
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -euo pipefail
          prefix="${{ matrix.prefix }}"
          # main: 45, 45.AAAAMMDD, latest · ark: ark-45, ark-45.AAAAMMDD, ark
          if [ "${{ matrix.flavor }}" = main ]; then
            tags="${FEDORA_VERSION} ${FEDORA_VERSION}.${BUILD_DATE} latest"
          else
            tags="${prefix}${FEDORA_VERSION} ${prefix}${FEDORA_VERSION}.${BUILD_DATE} ${{ matrix.flavor }}"
          fi
          for tag in $tags; do
            sudo podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:build ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done
          echo "digest=$(sudo cat /tmp/digestfile)" >> "$GITHUB_OUTPUT"

      # Assinatura da imagem (cosign), como no image-template. Só roda se o
      # segredo SIGNING_SECRET existir no repositório:
      #   cosign generate-key-pair      (sem senha)
      #   gh secret set SIGNING_SECRET < cosign.key
      #   git add cosign.pub            (a chave pública vai para o repositório)
      - name: Instalar o cosign
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v3.1.4"

      - name: Assinar a imagem
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if [ -z "${COSIGN_PRIVATE_KEY}" ]; then
            echo "::notice::SIGNING_SECRET não configurado: a imagem foi publicada sem assinatura."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Formato antigo de bundle, como no image-template (compatível com rpm-ostree).
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}
